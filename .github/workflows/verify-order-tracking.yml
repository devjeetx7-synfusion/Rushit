name: Verify order tracking

on:
  push:
    branches: [arena/e3c6e97f-rushit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-order-tracking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, debug build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build and run unit tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain
      - name: Summarize results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          print('::notice title=Unit tests::' + str(totals))
          report = 'app/build/reports/lint-results-debug.xml'
          try:
              issues = list(ET.parse(report).getroot().iter('issue'))
              print('::notice title=Lint errors::' + str(sum(i.get('severity') == 'Error' for i in issues)))
              print('::notice title=Lint warnings::' + str(sum(i.get('severity') == 'Warning' for i in issues)))
          except FileNotFoundError:
              print('No lint report produced')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: RushIt-order-tracking-${{ github.sha }}
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/app-debug.apk

  ui-tests:
    name: Compose tracking UI tests
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tracking UI tests on an emulator
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: RushIt-ui-test-reports-${{ github.sha }}
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
