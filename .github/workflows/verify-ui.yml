name: Verify UI work (temporary)

on:
  push:
    branches: [arena/f9d733f6-rushit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, debug build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Run unit tests and build the debug APK
        shell: bash
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain

      - name: Run Android lint
        id: lint
        continue-on-error: true
        shell: bash
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Report test and lint results
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/TEST-*.xml)
          if (( ${#files[@]} == 0 )); then
            echo "::error title=Unit tests::no test result XML was produced"
          else
            python3 -c "import glob,xml.etree.ElementTree as ET; n=f=e=s=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              r=ET.parse(p).getroot(); n+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              [print('::error title=Test failed::'+c.get('classname')+'.'+c.get('name')) for c in r.iter('testcase') if list(c.iter('failure')) or list(c.iter('error'))]
          print('::notice title=Unit tests::'+str(n)+' tests, '+str(f)+' failures, '+str(e)+' errors, '+str(s)+' skipped')" || true
          fi
          report=app/build/reports/lint-results-debug.xml
          if [[ -f "$report" ]]; then
            python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('$report').getroot(); i=[x for x in r.iter('issue') if x.get('severity')=='Error']
          print('::notice title=Lint::'+str(len(i))+' errors, '+str(len([x for x in r.iter('issue') if x.get('severity')=='Warning']))+' warnings')
          [print('::error title=Lint '+x.get('id')+'::'+x.get('message')+' ('+(x.find('location').get('file') if x.find('location') is not None else '?')+')') for x in i]" || true
          else
            echo "::notice title=Lint::no XML report produced"
          fi

      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RushIt-verify-reports
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/app-debug.apk
