name: RushIt User Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Only so a failed build can leave its compiler output on the pull request. Actions logs and
  # artifacts require signed-in web access to download, which makes a red run hard to diagnose.
  pull-requests: write

jobs:
  build-apk:
    name: Test, build and verify the signed debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # New runs of this workflow receive increasing numbers; a re-run keeps its original number.
      RUSHIT_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Validate Google, Supabase and CI version configuration
        shell: bash
        env:
          # Public client configuration only. Never add OAuth/client or Supabase server secrets.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import ipaddress
          import json
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          errors = []
          values = {}
          for name in ("GOOGLE_WEB_CLIENT_ID", "SUPABASE_URL", "SUPABASE_ANON_KEY"):
              value = os.environ.get(name, "").strip()
              values[name] = value
              if not value:
                  errors.append(f"{name} is missing. Set it in GitHub Actions repository Variables.")

          client_id = values["GOOGLE_WEB_CLIENT_ID"]
          if client_id and not re.fullmatch(r"[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com", client_id):
              errors.append("GOOGLE_WEB_CLIENT_ID must be the Web application OAuth client ID ending in .apps.googleusercontent.com, not an Android client ID or a client secret.")

          url = values["SUPABASE_URL"]
          if url:
              try:
                  parsed = urlsplit(url)
                  hostname = parsed.hostname or ""
                  try:
                      ipaddress.ip_address(hostname)
                      valid_host = True
                  except ValueError:
                      valid_host = len(hostname) <= 253 and all(
                          re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", label)
                          for label in hostname.split(".")
                      )
                  valid_url = (
                      parsed.scheme == "https" and valid_host
                      and parsed.username is None and parsed.password is None
                      and parsed.query == "" and parsed.fragment == ""
                      and "?" not in url and "#" not in url
                      and parsed.path in ("", "/")
                      and not any(c.isspace() or c == "\\" for c in url)
                  )
                  # Accessing port also rejects non-numeric and out-of-range ports.
                  if parsed.port is not None and not 1 <= parsed.port <= 65535:
                      valid_url = False
              except ValueError:
                  valid_url = False
              if not valid_url:
                  errors.append("SUPABASE_URL must be an HTTPS Supabase project origin, for example https://PROJECT.supabase.co, without credentials, a path, a query or a fragment.")

          key = values["SUPABASE_ANON_KEY"]
          if key:
              public_key = bool(re.fullmatch(r"sb_publishable_[A-Za-z0-9_-]+", key))
              if not public_key:
                  try:
                      segments = key.split(".")
                      if len(segments) != 3 or not all(
                          re.fullmatch(r"[A-Za-z0-9_-]+", segment) and len(segment) % 4 != 1
                          for segment in segments
                      ):
                          raise ValueError("Invalid JWT")
                      def decode(segment):
                          return base64.b64decode(
                              segment.translate(str.maketrans("-_", "+/")) + "=" * (-len(segment) % 4),
                              validate=True,
                          )
                      header = json.loads(decode(segments[0]))
                      payload = json.loads(decode(segments[1]))
                      if not decode(segments[2]):
                          raise ValueError("Empty JWT signature")
                      public_key = (
                          isinstance(header, dict) and isinstance(payload, dict)
                          and payload.get("role") == "anon"
                      )
                  except (ValueError, TypeError, UnicodeError):
                      public_key = False
              if not public_key:
                  errors.append("SUPABASE_ANON_KEY must be an sb_publishable_... key or a valid legacy JWT with role=anon. Secret/service-role keys are forbidden in the APK.")

          version = os.environ.get("RUSHIT_VERSION_CODE", "")
          if not re.fullmatch(r"[1-9][0-9]*", version) or not 1 <= int(version or 0) <= 2100000000:
              errors.append("RUSHIT_VERSION_CODE must be a positive integer no greater than 2100000000; CI supplies github.run_number.")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print("Google/Supabase public configuration and CI versionCode passed preflight validation.")
          PY

      - name: Prepare persistent test signing when configured
        shell: bash
        env:
          RUSHIT_TEST_KEYSTORE_BASE64: ${{ secrets.RUSHIT_TEST_KEYSTORE_BASE64 }}
          RUSHIT_TEST_KEYSTORE_PASSWORD: ${{ secrets.RUSHIT_TEST_KEYSTORE_PASSWORD }}
          RUSHIT_TEST_KEY_ALIAS: ${{ secrets.RUSHIT_TEST_KEY_ALIAS }}
          RUSHIT_TEST_KEY_PASSWORD: ${{ secrets.RUSHIT_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${RUSHIT_TEST_KEYSTORE_BASE64:-}" ]]; then
            echo "::warning::Persistent test keystore is missing. The APK will use this runner's ephemeral default debug signing identity and may not update the previously installed build. Configure all four RUSHIT_TEST_* signing secrets for stable updates."
            # A partial configuration must not silently fall back to a different identity.
            if [[ -n "${RUSHIT_TEST_KEYSTORE_PASSWORD:-}${RUSHIT_TEST_KEY_ALIAS:-}${RUSHIT_TEST_KEY_PASSWORD:-}" ]]; then
              echo "::error::RUSHIT_TEST_KEYSTORE_BASE64 is missing while other test-signing secrets are set. Configure all four signing secrets."
              exit 1
            fi
            exit 0
          fi
          missing=()
          for name in RUSHIT_TEST_KEYSTORE_PASSWORD RUSHIT_TEST_KEY_ALIAS RUSHIT_TEST_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Incomplete test signing configuration; missing: ${missing[*]}."
            exit 1
          fi

          # Only this step receives the Base64 secret. The decoded file is never in the checkout,
          # Gradle project cache, uploaded artifacts or failure comments. Do not enable shell tracing.
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/rushit-test-signing.XXXXXXXX")"
          keystore_path="$signing_dir/rushit-test.p12"
          # Export only the path, never credentials, through GITHUB_ENV. Publish it before
          # validation so the always-run cleanup also removes a malformed temporary keystore.
          printf 'RUSHIT_TEST_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"
          if ! python3 - "$keystore_path" <<'PY'
          import base64
          import os
          import sys
          try:
              # Accept wrapped Base64 from platform tools, but reject non-Base64 characters.
              encoded = "".join(os.environ["RUSHIT_TEST_KEYSTORE_BASE64"].split())
              decoded = base64.b64decode(encoded, validate=True)
              if not decoded:
                  raise ValueError("Empty keystore")
              with open(sys.argv[1], "xb") as output:
                  output.write(decoded)
          except (ValueError, OSError, KeyError):
              # Exception text can contain input; deliberately do not print it.
              sys.exit(1)
          PY
          then
            echo "::error::RUSHIT_TEST_KEYSTORE_BASE64 could not be decoded into a non-empty temporary keystore. Replace it with Base64 of the original binary keystore."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore_path" \
              -alias "$RUSHIT_TEST_KEY_ALIAS" \
              -storepass:env RUSHIT_TEST_KEYSTORE_PASSWORD >/dev/null 2>"$signing_dir/keystore-error.log"; then
            echo "::error::The test keystore, store password or key alias is invalid. Check the four RUSHIT_TEST_* secrets; no keystore material was logged."
            exit 1
          fi
          echo "Persistent test keystore validated in RUNNER_TEMP; signing credentials are not logged."

      - name: Run unit tests and build the signed debug APK
        shell: bash
        env:
          # These public values are bundled in the APK; never use privileged credentials.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          RUSHIT_TERMS_URL: ${{ vars.RUSHIT_TERMS_URL }}
          RUSHIT_PRIVACY_URL: ${{ vars.RUSHIT_PRIVACY_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          RUSHIT_TEST_KEYSTORE_PASSWORD: ${{ secrets.RUSHIT_TEST_KEYSTORE_PASSWORD }}
          RUSHIT_TEST_KEY_ALIAS: ${{ secrets.RUSHIT_TEST_KEY_ALIAS }}
          RUSHIT_TEST_KEY_PASSWORD: ${{ secrets.RUSHIT_TEST_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          set +x
          # Google Sign-In is the only authentication method, so the auth unit tests must pass
          # before an APK is produced. They run on the JVM: no emulator, no signing keys, no network.
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          result="${PIPESTATUS[0]}"
          # Publish only aggregate test counts, never test logs that could contain fixture values.
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, '0'))
          if totals['tests']:
              print('::notice::Unit tests: %d run, %d failures, %d errors, %d skipped.' % (
                  totals['tests'], totals['failures'], totals['errors'], totals['skipped']))
          PY
          exit "$result"

      - name: Verify APK identity, configuration and signature
        shell: bash
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::The expected debug APK is missing or empty."
            exit 1
          fi
          aapt="${ANDROID_HOME:?Android SDK is not configured}/build-tools/34.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [[ ! -x "$aapt" || ! -x "$apksigner" ]]; then
            echo "::error::Android SDK Build-Tools 34.0.0 are unavailable."
            exit 1
          fi
          if ! badging="$("$aapt" dump badging "$APK_PATH" 2>/dev/null)"; then
            echo "::error::Could not read the APK manifest."
            exit 1
          fi
          package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p")"
          if [[ "$package_name" != 'com.rushit.app' ]]; then
            echo "::error::The APK application ID is not com.rushit.app."
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]] || (( version_code > 2100000000 )); then
            echo "::error::The APK versionCode must be an integer from 1 to 2100000000."
            exit 1
          fi
          if [[ "$version_code" != "$RUSHIT_VERSION_CODE" ]]; then
            echo "::error::APK versionCode $version_code does not match this run's expected versionCode $RUSHIT_VERSION_CODE."
            exit 1
          fi

          # Inspect the generated constant as well as the packaged DEX strings. This catches a
          # wiring mistake without decompiling or logging any Supabase key or signing material.
          if ! python3 - "$APK_PATH" <<'PY'
          import os
          from pathlib import Path
          import re
          import sys
          import zipfile
          expected = os.environ["GOOGLE_WEB_CLIENT_ID"].strip()
          source = Path("app/build/generated/source/buildConfig/debug/com/rushit/app/BuildConfig.java")
          try:
              match = re.search(r'String GOOGLE_WEB_CLIENT_ID = "([^"]*)";', source.read_text())
              constant_matches = match is not None and match.group(1) == expected
              with zipfile.ZipFile(sys.argv[1]) as apk:
                  dex_names = [name for name in apk.namelist() if re.fullmatch(r"classes[0-9]*\.dex", name)]
                  packaged = any(expected.encode("utf-8") in apk.read(name) for name in dex_names)
              if not constant_matches or not packaged:
                  sys.exit(1)
          except (OSError, KeyError, zipfile.BadZipFile):
              sys.exit(1)
          PY
          then
            echo "::error::The APK does not contain the configured GOOGLE_WEB_CLIENT_ID in its generated BuildConfig and DEX."
            exit 1
          fi

          # Verify the browser callback is actually packaged, not just present in source.
          manifest_xml="$("$aapt" dump xmltree "$APK_PATH" AndroidManifest.xml)"
          if ! printf '%s\n' "$manifest_xml" | grep -q 'android:scheme.*"rushit"' ||
             ! printf '%s\n' "$manifest_xml" | grep -q 'android:host.*"auth"' ||
             ! printf '%s\n' "$manifest_xml" | grep -q 'android:path.*"/callback"'; then
            echo "::error::The APK is missing the exact rushit://auth/callback intent filter."
            exit 1
          fi
          if ! python3 - "$APK_PATH" <<'PY'
          import re, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              dex = b''.join(apk.read(n) for n in apk.namelist() if re.fullmatch(r'classes[0-9]*\.dex', n))
          required = [
              b'Landroidx/credentials/CredentialManager;',
              b'Lcom/google/android/libraries/identity/googleid/GetGoogleIdOption;',
              b'Lcom/rushit/app/data/auth/google/GoogleSignInCoordinator;',
              b'Lcom/rushit/app/data/auth/google/SupabaseOAuthRedirect;',
          ]
          sys.exit(0 if all(marker in dex for marker in required) else 1)
          PY
          then
            echo "::error::The APK is missing Credential Manager or RushIt's verified OAuth fallback classes."
            exit 1
          fi

          # apksigner prints public certificate details only. Capture first so a failed command
          # cannot accidentally contribute keystore passwords or other diagnostics to the log.
          if ! verification="$("$apksigner" verify --verbose --print-certs --min-sdk-version 24 "$APK_PATH" 2>&1)"; then
            echo "::error::APK signature verification failed. No APK artifact will be uploaded."
            exit 1
          fi
          sha1="$(printf '%s\n' "$verification" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-1 digest: //p')"
          sha256="$(printf '%s\n' "$verification" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')"
          if [[ ! "$sha1" =~ ^[0-9a-fA-F]{40}$ || ! "$sha256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Could not read exactly one signing certificate's SHA-1 and SHA-256 fingerprints."
            exit 1
          fi
          echo "Verified com.rushit.app test APK with versionCode $version_code and configured Google Web Client ID."
          echo "::notice::APK verified: com.rushit.app, versionCode $version_code; Google Web Client ID, Credential Manager, Supabase OAuth fallback and rushit://auth/callback are packaged; signature valid."
          printf '%s\n' "$verification" | grep -E '^(Verifies|Verified using v[1234] scheme)'
          echo "Signing certificate SHA-1: ${sha1,,}"
          echo "Signing certificate SHA-256: ${sha256,,}"
          {
            echo "### RushIt test APK verified"
            echo "- Package: \`com.rushit.app\`"
            echo "- versionCode: \`$version_code\`"
            echo "- Certificate SHA-1: \`${sha1,,}\`"
            echo "- Certificate SHA-256: \`${sha256,,}\`"
            echo "- APK artifact: \`rushit-user-apk\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary test keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +x
          keystore_path="${RUSHIT_TEST_KEYSTORE_PATH:-}"
          if [[ -n "$keystore_path" ]]; then
            signing_dir="${keystore_path%/*}"
            # Delete only the two files created by this workflow, never a recursive/wildcard path.
            if [[ "$signing_dir" == "$RUNNER_TEMP"/rushit-test-signing.???????? &&
                  "${keystore_path##*/}" == 'rushit-test.p12' ]]; then
              rm -f -- "$signing_dir/rushit-test.p12" "$signing_dir/keystore-error.log"
              rmdir -- "$signing_dir" 2>/dev/null || true
            fi
          fi

      - name: Report a failed build on the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          {
            printf 'Build failed at %s.\n\n```\n' "$GITHUB_SHA"
            LOG="$RUNNER_TEMP/build.log"
            if [ -f "$LOG" ]; then
              grep -E '^e: |^w: |error:|FAILURE:|What went wrong|Caused by:|Execution failed for task|> Task .*FAILED|tests? completed' "$LOG" | head -n 200
              printf '\n'
              tail -n 60 "$LOG"
            else
              printf 'No Gradle log was produced; the step failed before Gradle ran.\n'
            fi
            # An assertion failure only appears in the XML report, and assertTrue carries no
            # message, so the stack trace is the only way to tell which line failed.
            printf '\n'
            python3 - <<'PYEOF'
          import glob
          import xml.etree.ElementTree as ET
          for path in sorted(glob.glob('app/build/test-results/**/*.xml', recursive=True)):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for failure in list(case.iter('failure')) + list(case.iter('error')):
                      print()
                      print('FAILED: %s > %s' % (case.get('classname'), case.get('name')))
                      print((failure.text or failure.get('message') or '(no detail)')[:3000])
          PYEOF
            printf '```\n'
          } > /tmp/comment.md
          head -c 60000 /tmp/comment.md > /tmp/comment-trimmed.md
          jq -Rs '{body: .}' < /tmp/comment-trimmed.md > /tmp/comment.json
          gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input /tmp/comment.json

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rushit-user-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload RushIt User APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rushit-user-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
