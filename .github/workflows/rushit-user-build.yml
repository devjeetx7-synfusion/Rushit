name: RushIt User Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and verify signed debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build the signed debug APK
        shell: bash
        env:
          # These optional values are bundled in the APK; never use privileged credentials.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          RUSHIT_TERMS_URL: ${{ vars.RUSHIT_TERMS_URL }}
          RUSHIT_PRIVACY_URL: ${{ vars.RUSHIT_PRIVACY_URL }}
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Verify APK identity and signature
        shell: bash
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::The expected debug APK is missing or empty."
            exit 1
          fi
          aapt="${ANDROID_HOME:?Android SDK is not configured}/build-tools/34.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [[ ! -x "$aapt" || ! -x "$apksigner" ]]; then
            echo "::error::Android SDK Build-Tools 34.0.0 are unavailable."
            exit 1
          fi
          if ! badging="$("$aapt" dump badging "$APK_PATH" 2>/dev/null)"; then
            echo "::error::Could not read the APK manifest."
            exit 1
          fi
          package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p")"
          if [[ "$package_name" != 'com.rushit.app' ]]; then
            echo "::error::The APK application ID is not com.rushit.app."
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The APK versionCode must be a positive integer."
            exit 1
          fi
          if ! verification="$("$apksigner" verify --verbose --print-certs "$APK_PATH" 2>&1)"; then
            echo "::error::APK signature verification failed."
            exit 1
          fi
          certificate="$(printf '%s\n' "$verification" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')"
          if [[ ! "$certificate" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Could not read the debug signing certificate fingerprint."
            exit 1
          fi
          echo "Verified com.rushit.app test APK with versionCode $version_code."
          echo "Debug certificate SHA-256: ${certificate,,}"

      - name: Upload RushIt User APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rushit-user-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
