name: Build test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and verify signed debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and check the persistent test keystore
        id: restore-keystore
        shell: bash
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
          TEST_CERT_SHA256: ${{ vars.TEST_CERT_SHA256 }}
          RUSHIT_TEST_KEYSTORE_FILE: ${{ runner.temp }}/rushit-test-signing.keystore
        run: |
          set -euo pipefail
          for name in TEST_KEYSTORE_BASE64 TEST_KEYSTORE_PASSWORD TEST_KEY_ALIAS TEST_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret $name is missing. Restore the original test signing configuration."
              exit 1
            fi
          done
          if [[ -z "${TEST_CERT_SHA256:-}" ]]; then
            echo "::error::Required Actions variable TEST_CERT_SHA256 is missing. Configure the original test certificate fingerprint."
            exit 1
          fi
          expected="${TEST_CERT_SHA256//:/}"
          expected="${expected,,}"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::TEST_CERT_SHA256 must be a SHA-256 certificate fingerprint."
            exit 1
          fi
          if [[ -e "$RUSHIT_TEST_KEYSTORE_FILE" || -L "$RUSHIT_TEST_KEYSTORE_FILE" ]]; then
            echo "::error::The temporary keystore path already exists; refusing to overwrite it."
            exit 1
          fi
          # Remove a partially restored keystore on failure; keep it only for this job on success.
          trap 'status=$?; if (( status != 0 )); then rm -f -- "$RUSHIT_TEST_KEYSTORE_FILE"; fi' EXIT
          umask 077
          if ! printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$RUSHIT_TEST_KEYSTORE_FILE" 2>/dev/null; then
            echo "::error::TEST_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if [[ ! -s "$RUSHIT_TEST_KEYSTORE_FILE" ]]; then
            echo "::error::The restored test keystore is empty."
            exit 1
          fi
          if ! actual="$(keytool -exportcert -keystore "$RUSHIT_TEST_KEYSTORE_FILE" \
              -storepass:env TEST_KEYSTORE_PASSWORD -alias "$TEST_KEY_ALIAS" 2>/dev/null | sha256sum | cut -d ' ' -f 1)"; then
            echo "::error::Cannot read the test certificate. Check the keystore, store password and alias."
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The test keystore does not match TEST_CERT_SHA256. Restore the original key; do not generate a replacement."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build the signed debug APK
        shell: bash
        env:
          RUSHIT_TEST_SIGNING: 'true'
          RUSHIT_TEST_KEYSTORE_FILE: ${{ runner.temp }}/rushit-test-signing.keystore
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
          # These optional values are bundled in the APK; never use privileged credentials.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          RUSHIT_TERMS_URL: ${{ vars.RUSHIT_TERMS_URL }}
          RUSHIT_PRIVACY_URL: ${{ vars.RUSHIT_PRIVACY_URL }}
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Verify APK identity and signature
        shell: bash
        env:
          TEST_CERT_SHA256: ${{ vars.TEST_CERT_SHA256 }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::The expected debug APK is missing or empty."
            exit 1
          fi
          aapt="${ANDROID_HOME:?Android SDK is not configured}/build-tools/34.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [[ ! -x "$aapt" || ! -x "$apksigner" ]]; then
            echo "::error::Android SDK Build-Tools 34.0.0 are unavailable."
            exit 1
          fi
          if ! badging="$("$aapt" dump badging "$APK_PATH" 2>/dev/null)"; then
            echo "::error::Could not read the APK manifest."
            exit 1
          fi
          package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p")"
          if [[ "$package_name" != 'com.rushit.app' ]]; then
            echo "::error::The APK application ID is not com.rushit.app."
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The APK versionCode must be a positive integer."
            exit 1
          fi
          if ! verification="$("$apksigner" verify --verbose --print-certs "$APK_PATH" 2>&1)"; then
            echo "::error::APK signature verification failed."
            exit 1
          fi
          expected="${TEST_CERT_SHA256//:/}"
          expected="${expected,,}"
          actual="$(printf '%s\n' "$verification" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')"
          actual="${actual,,}"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The APK is not signed exclusively with the pinned test certificate."
            exit 1
          fi
          echo "Verified com.rushit.app test APK with versionCode $version_code and the pinned signing certificate."

      - name: Upload test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RushIt-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Remove the temporary keystore
        if: ${{ always() && steps.restore-keystore.outcome == 'success' }}
        shell: bash
        env:
          RUSHIT_TEST_KEYSTORE_FILE: ${{ runner.temp }}/rushit-test-signing.keystore
        run: rm -f -- "$RUSHIT_TEST_KEYSTORE_FILE"
